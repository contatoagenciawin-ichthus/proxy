name: Meta Provider admin
on:
  pull_request:
    paths:
      - 'app/meta/admin/**'
      - 'app/api/meta/admin/**'
      - 'lib/meta-admin/**'
      - 'tests/meta-admin*'
      - 'tests/sql/meta-admin*'
      - 'db/staged/0001_proxy_connection_receipts.sql'
      - 'tsconfig.meta-admin.json'
      - 'package*.json'
      - 'next.config.mjs'
      - '.github/workflows/meta-admin.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-fixture-only
          POSTGRES_DB: proxy_control_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d proxy_control_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Central receipt SQL integration (disposable Postgres 17)
        env:
          PG_SERVICE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$PG_SERVICE_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d proxy_control_test < db/staged/0001_proxy_connection_receipts.sql
          docker exec -i "$PG_SERVICE_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d proxy_control_test < tests/sql/meta-admin-connection-receipts.sql
      - run: node --test tests/meta-admin*.test.mjs
      - run: npx tsc -p tsconfig.meta-admin.json --noEmit
      - run: npm run build
      - run: node tests/meta-admin-http.mjs
