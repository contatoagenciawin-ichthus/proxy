name: Proxy G2 permit security (isolated)

on:
  pull_request:
    paths:
      - "lib/ichthus-*.mjs"
      - "tests/ichthus-*.test.mjs"
      - "tests/sql/ichthus-proxy-replay-ledger.sql"
      - "db/staged/0001_ichthus_proxy_permit_replay_STAGED.sql"
      - ".github/workflows/g2-ichthus-permit-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: proxy_g2_ephemeral
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: github_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d proxy_g2_ephemeral"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify JS permit contract and replay rejection
        run: node --test tests/ichthus-*.test.mjs tests/meta-onboarding-handoffs.test.mjs
      - name: Verify migration and forced RLS in disposable PostgreSQL
        env:
          PGPASSWORD: github_test_only
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d proxy_g2_ephemeral -f tests/sql/ichthus-proxy-replay-ledger.sql
